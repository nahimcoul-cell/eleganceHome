services:
  - type: web
    name: elegance-home-multi-service
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: EHMS_DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: EHMS_ADMIN_PASSWORD
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: ehms-data
      mountPath: /var/data
      sizeGB: 1
